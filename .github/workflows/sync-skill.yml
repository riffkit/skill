name: sync-skill

# Keep SKILL.md in this repo mirrored to the live, canonical
# https://riffkit.ai/SKILL.md (the single source of truth, served from the
# Riffkit app). Runs daily + on-demand. The agent always reads the live URL,
# so this mirror is for human browsing / GitHub discovery and never blocks use.

on:
  schedule:
    - cron: "0 6 * * *" # daily ~06:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button (e.g. right after a deploy)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull live skill files
        run: |
          curl -fsSL https://riffkit.ai/SKILL.md     -o SKILL.md
          curl -fsSL https://riffkit.ai/HEARTBEAT.md -o HEARTBEAT.md
          curl -fsSL https://riffkit.ai/SKILL.json   -o SKILL.json
          # Second copy under riffkit/ so the REPO ITSELF is a valid skill root.
          # dsh (and every other harness reading ~/.agents/skills) discovers
          # `<name>/SKILL.md` and takes the skill's name from that directory — it
          # does no nested discovery. With SKILL.md only at the repo root, cloning
          # or copying this repo into a skill root yields `skill/SKILL.md`, i.e. a
          # skill called "skill". The root copy stays (raw-URL installs and the
          # README point at it); this adds the layout that `git clone` + copy needs.
          mkdir -p riffkit
          cp SKILL.md riffkit/SKILL.md
          cp HEARTBEAT.md riffkit/HEARTBEAT.md
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "riffkit-bot"
            git config user.email "bot@riffkit.ai"
            git add SKILL.md HEARTBEAT.md SKILL.json riffkit/
            git commit -m "chore: sync SKILL.md / HEARTBEAT.md / SKILL.json from riffkit.ai (+ riffkit/ skill-root copy)"
            git push
          else
            echo "Already up to date."
          fi
